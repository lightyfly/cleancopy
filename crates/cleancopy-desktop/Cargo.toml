[package]
name = "cleancopy-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "CleanCopy desktop UI, configuration, and paste engine"

[[bin]]
name = "cleancopy-app"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.31.1", default-features = false, features = ["default_fonts", "glow", "x11"] }
clap.workspace = true
cleancopy-core = { path = "../cleancopy-core" }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
dirs = "6"
tempfile = "3"
html2md = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
cleancopy-clipboard = { path = "../cleancopy-clipboard" }
x11rb = { version = "0.13", features = ["xtest"] }
libc = "0.2"
raw-window-handle = "0.6"
ksni = { version = "0.3.7", default-features = false, features = ["async-io", "blocking"] }

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
window-vibrancy = "0.8"
raw-window-handle = "0.6"

[dev-dependencies]
x11rb = "0.13"
png = "0.17"
proptest = "1"
