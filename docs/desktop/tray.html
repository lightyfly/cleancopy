<html><head><link rel="stylesheet" href="base.css"><style>
body{width:720px;height:520px;background:linear-gradient(160deg,#DCE3F0,#EFE9E1)}
.bar{height:26px;background:rgba(255,255,255,.55);backdrop-filter:blur(20px);display:flex;justify-content:flex-end;align-items:center;gap:18px;padding:0 16px;font-size:12.5px;font-weight:500}
.ico{width:22px;height:20px;border-radius:5px;background:rgba(0,0,0,.12);display:flex;align-items:center;justify-content:center;font-size:12px}
.m{position:absolute;right:150px;top:32px;width:300px}
.st{display:flex;align-items:center;gap:8px;padding:8px 10px}
.g{width:8px;height:8px;border-radius:50%;background:#30C25A}
.sw{width:30px;height:18px;border-radius:9px;background:var(--accent);position:relative}.sw:after{content:"";position:absolute;right:2px;top:2px;width:14px;height:14px;border-radius:50%;background:#fff}
.recent{padding:2px 10px 6px;color:var(--sub);font-size:12px;line-height:1.7}
.recent div{display:flex;justify-content:space-between}
</style></head><body>
<div class="bar"><span>🔋</span><span>Wi‑Fi</span><span class="ico">✦</span><span>11月1日 周日 12:05</span></div>
<div class="menu m">

 <div class="sep"></div>
 <div class="hd">最近粘贴</div>
 <div class="recent"><div><span>Word → 标题/列表/表格</span><span>2 分钟前</span></div><div><span>记事本 → 中文序号</span><span>18 分钟前</span></div></div>

 <div class="item"><span class="ic">✦</span><span class="lb">唤出粘贴菜单</span><span class="kbd"><span>⌘</span><span>⇧</span><span>V</span></span></div>
 <div class="item on"><span class="ic">↺</span><span class="lb">撤销上次转换</span></div>

</div></body></html>
